<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Finanças, diário, agenda e organização pessoal em um só lugar." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>CP Hub</title>
    <meta name="apple-mobile-web-app-title" content="CP Hub" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('central-pessoal:theme') || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      try { var accent = localStorage.getItem('central-pessoal:accent'); if (accent) document.documentElement.dataset.accent = accent; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
